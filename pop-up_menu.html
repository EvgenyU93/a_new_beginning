<!DOCTYPE html>
<html lang="en">
<head>

<body>

        <header class="pop-up-menu__header">
            <button class="pop-up-menu__exit-button button" aria-label="Кнопка выхода из бокового меню">
                <img src="/image/icon/exit_icon.svg">
            </button>
            <button class="pop-up-menu__logo">
                <img src="/image/Logo/Group.png" alt="Логотип компании">
            </button>
            <button class="pop-up-menu__search-button button" aria-label="Кнопка открытия происковой строки">
                <img src="/image/icon/search_icon.svg">
            </button>
        </header>
        
        <ul class="pop-up-menu__list-services">
            <li class="pop-up-menu__item">
                <a href="#" class="pop-up-menu__link link--active">Ремонт техники</a>
            </li>
            <li class="pop-up-menu__item">
                <a href="#" class="pop-up-menu__link">Услуги и сервисы</a>

            <li class="pop-up-menu__item">

                <a href="#" class="pop-up-menu__link">Производителям</a>
            </li>
            <li class="pop-up-menu__item">
                <a href="#" class="pop-up-menu__link">Наши сервисные центры</a>
            </li>
            <li class="pop-up-menu__item">
                <a href="#" class="pop-up-menu__link">Контакты</a>
            </li>
        </ul>
        
        <footer class="pop-up-menu__fotter">
            <div class="pop-up-menu__contacts">
                <div class="pop-up-menu__button-block">
                    <button class="pop-up-menu__button-call button" aria-label="Кнопка телефонного звонка">

                    <button class="pop-up-menu__button-chat button" aria-label="Кнопка перехода в чат с компанией">

                    </button>

                <a href="mailto:support@service.ru" class="pop-up-menu__mail">mail@cps.com</a>
                <a href="tel:+78008908900" class="pop-up-menu__tel">8 800 890 8900</a>
            </div>
            <div class="pop-up-menu__language language__button-block">
                <button class="language__button button__ru button--active" aria-label="Кнопка выбора Русского языка">ru</button>
                <button class="language__button button__en" aria-label="Кнопка выбора Английского языка">en</button>
                <button class="language__button button__ch" aria-label="Кнопка выбора Китайского языка">ch</button>
            </div>
